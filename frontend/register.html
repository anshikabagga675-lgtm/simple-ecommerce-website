<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — Simple Store</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">s.</span> simple<span>store</span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="main-nav"><a href="index.html#shop">Shop</a><a href="index.html#categories">Categories</a><a href="orders.html">My orders</a></nav><div class="header-actions"><a class="account-link" href="login.html">Sign in</a><a class="cart-link" href="cart.html">Bag <span class="cart-count">0</span></a></div></header>
  <main class="auth-wrap"><div class="auth-card"><span class="eyebrow">Make yourself at home</span><h1>Your kind of good.</h1><p>Create an account to keep your orders and details together.</p><form id="register-form" novalidate><label>Your name<input name="name" type="text" autocomplete="name" required minlength="2" maxlength="80" placeholder="Alex Morgan"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="At least 8 characters"></label><button class="button button-dark button-full" type="submit">Create account <span>↗</span></button><div class="form-message" role="status"></div></form><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></div></main>
  <footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">s.</span> simple<span>store</span></a><p>Thoughtful finds for everyday living.</p><small>© Simple Store. Demo checkout only.</small></footer><script src="js/api.js"></script><script src="js/auth.js"></script></body>
</html>
