<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Simple Store</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">s.</span> simple<span>store</span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="main-nav"><a href="index.html#shop">Shop</a><a href="index.html#categories">Categories</a><a href="orders.html">My orders</a></nav><div class="header-actions"><a class="account-link active" href="login.html">Sign in</a><a class="cart-link" href="cart.html">Bag <span class="cart-count">0</span></a></div></header>
